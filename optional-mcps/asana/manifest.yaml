# Nous-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: asana
description: >-
  Tasks, projects, and goals from your Asana workspace.
source: https://developers.asana.com/docs/using-asanas-mcp-server

# Official vendor-hosted remote MCP (URL-only — Hermes never spawns a local
# process for this entry). The V1 endpoint (/sse) shut down 2026-08-05;
# V2 is Streamable HTTP and does NOT support Dynamic Client Registration —
# Asana requires a pre-registered OAuth app (issue #113907). Hermes's MCP
# client + mcp_oauth_manager still handle PKCE, token exchange, and refresh
# once the user supplies a static client_id/client_secret.
transport:
  type: http
  url: https://mcp.asana.com/v2/mcp

auth:
  type: oauth

# Composer-suggestion triggers (desktop brand pills).
suggest:
  keywords:
    - asana
  hosts:
    - asana.com

post_install: |
  Asana V2 has no Dynamic Client Registration: create an Asana MCP app in
  the Asana developer console first, register the callback Hermes will use,
  then set oauth.client_id/client_secret for this server (config.yaml +
  .env — never commit secrets). See the pre-registered-client walkthrough
  in the OAuth over SSH / Remote Hosts guide. Then run
  `hermes mcp login asana`, approve access, and restart the session so
  tools load.
